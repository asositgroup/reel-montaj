<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Marketing jurnal muqovasi</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton.ttf"); }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-var.ttf"); font-weight: 100 900; }
      @font-face { font-family: "Playfair"; src: url("assets/fonts/PlayfairDisplay-Italic-var.ttf"); font-weight: 400 900; font-style: italic; }
      :root { --ink: {{INK}}; --acc: {{ACC}}; --cream: #f8f1e4; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0c0b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d0c0b; font-family: "Inter", sans-serif; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
      #aroll, #subj { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #dark { position: absolute; inset: 0; background: #070707; opacity: 0; }
      .bw { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: "Anton", sans-serif; line-height: 0.9;
        letter-spacing: 0.005em; overflow: visible; }
      .bwi { display: inline-block; transform-origin: 50% 70%; }
      #w6 .bwi { text-shadow: 0 0 60px rgba(217,83,30,.55), 0 0 18px rgba(217,83,30,.4); }
      .shade-b { position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: linear-gradient(0deg, rgba(8,8,8,.62), rgba(8,8,8,0)); pointer-events: none; }
      .caps { font-weight: 600; font-size: 28px; letter-spacing: .34em; text-transform: uppercase; }
      .sh { text-shadow: 0 3px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.45); }

      /* iqtibos */
      #quote { position: absolute; left: 70px; right: 70px; top: 1380px; }
      #quote .lab { color: var(--acc); }
      #quote .tx { margin-top: 16px; font: italic 600 74px/1.12 "Playfair", serif; color: #fff; }
      #quote .qm { color: var(--acc); }

      /* subtitr */
      .cap { position: absolute; left: 70px; right: 70px; top: 1700px; text-align: center; }
      .cap span { display: inline-block; font-weight: 600; font-size: 44px; line-height: 1.22; color: #fff; letter-spacing: -0.01em;
        text-shadow: 0 2px 14px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.5); }

      /* vaqt chizig'i */
      #tl { position: absolute; left: 60px; right: 60px; top: 1390px; }
      .glass { background: rgba(14,13,12,.5); border: 1.5px solid rgba(255,255,255,.18); border-radius: 30px;
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
      .tl-in { padding: 26px 34px 30px; }
      .tl-h { display: flex; justify-content: space-between; align-items: baseline; color: #fff; }
      .tl-h b { font-weight: 700; font-size: 30px; letter-spacing: .26em; }
      .tl-h span { display: grid; font: italic 600 44px/1 "Playfair", serif; }
      .tl-h span > * { grid-area: 1 / 1; text-align: right; }
      #tlb { color: var(--acc); opacity: 0; }
      .trk { position: relative; height: 70px; margin-top: 26px; }
      .trk .ln { position: absolute; left: 0; right: 0; top: 34px; height: 3px; background: rgba(255,255,255,.28); transform-origin: 0 50%; }
      .trk .fill { position: absolute; left: 0; right: 0; top: 33px; height: 5px; background: var(--acc); border-radius: 3px; transform-origin: 0 50%; }
      .tick { position: absolute; top: 46px; font-weight: 500; font-size: 22px; color: rgba(255,255,255,.6); transform: translateX(-50%); }
      .cd { position: absolute; top: 25px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.6); opacity: 0; }

      /* xarita kartasi */
      #map { position: absolute; left: 60px; right: 60px; top: 1300px; }
      .map-in { position: relative; height: 330px; overflow: hidden; }
      .map-in svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .road { stroke: rgba(255,255,255,.16); stroke-width: 26; fill: none; stroke-linecap: round; }
      .road2 { stroke: rgba(255,255,255,.08); stroke-width: 12; fill: none; }
      .pin { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); }
      .pin i { width: 56px; height: 56px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: block; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
      .pin b { margin-top: 14px; font-weight: 700; font-size: 22px; letter-spacing: .2em; color: #fff; white-space: nowrap; }
      #pinA i { background: #6b6b6b; } #pinB i { background: var(--acc); }
      .walker { position: absolute; left: 0; top: 250px; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; opacity: .9; }
      #mapq { position: absolute; left: 0; right: 0; top: 1680px; text-align: center; font: italic 600 64px/1.1 "Playfair", serif; color: #fff; }

      /* chiplar */
      #chips { position: absolute; left: 0; right: 0; top: 1400px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .chip { padding: 18px 36px 20px; border-radius: 60px; font-weight: 700; font-size: 46px; letter-spacing: -0.01em; color: #fff; }
      .chip.on { background: var(--acc); border-color: transparent; }

      /* to'lqinlar */
      #rings { position: absolute; left: 540px; top: 760px; width: 0; height: 0; }
      .ring { position: absolute; left: -200px; top: -200px; width: 400px; height: 400px; border-radius: 50%; border: 3px solid rgba(217,83,30,.75); opacity: 0; }

      /* b-roll */
      .brw { position: absolute; inset: 0; }
      .brw video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .brl { position: absolute; left: 0; right: 0; top: 260px; text-align: center; color: #fff; font-size: 34px; text-shadow: 0 2px 16px rgba(0,0,0,.7); }
      .split { position: absolute; left: 0; right: 0; top: 962px; height: 958px; overflow: hidden; }
      .split video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .divider { position: absolute; left: 0; right: 0; top: 954px; height: 8px; }
      .div-in { width: 100%; height: 100%; background: var(--acc); }
      #black { position: absolute; inset: 0; background: #070707; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="{{DUR}}" data-track-index="0" muted playsinline></video>
        <div id="dark"></div>
        {{WORDS}}
        <video id="subj" class="clip" src="assets/subject_full.webm" data-start="0" data-duration="{{DUR}}" data-track-index="1" muted playsinline></video>
      </div>
      <div class="shade-b"></div>

      <div id="quote" class="clip sh" data-start="0.10" data-duration="3.20" data-track-index="50">
        <div class="lab caps">Ko‘p eshitgan gapimiz</div>
        <div class="tx"><span class="qm">“</span>Mahsuloti zo‘r bo‘lsa,<br>odamlar o‘zi keladi<span class="qm">”</span></div>
      </div>

      <div id="tl" class="clip" data-start="3.45" data-duration="16.65" data-track-index="51">
        <div class="tl-in glass">
          <div class="tl-h"><b>MIJOZ YIG‘ISH</b><span><i id="tla" style="font-style:italic">yillar davomida</i><i id="tlb" style="font-style:italic">marketing bilan — tez</i></span></div>
          <div class="trk"><div class="ln" id="tln"></div><div class="fill" id="tlf"></div>
            <span class="tick" style="left:0%">1-yil</span><span class="tick" style="left:25%">2</span><span class="tick" style="left:50%">3</span><span class="tick" style="left:75%">4</span><span class="tick" style="left:100%">5-yil</span>
            <i class="cd" id="cd0" style="left:8%"></i><i class="cd" id="cd1" style="left:22%"></i><i class="cd" id="cd2" style="left:41%"></i><i class="cd" id="cd3" style="left:60%"></i><i class="cd" id="cd4" style="left:79%"></i><i class="cd" id="cd5" style="left:95%"></i>
          </div>
        </div>
      </div>

      <div id="map" class="clip" data-start="26.35" data-duration="7.30" data-track-index="52">
        <div class="map-in glass">
          <svg viewBox="0 0 960 330"><path class="road2" d="M60 60 L60 300"/><path class="road2" d="M120 300 L120 200"/>
            <path class="road" d="M-20 250 L980 250"/><path class="road2" d="M700 0 L700 330"/></svg>
          <div class="pin" id="pinA" style="left:110px;top:140px"><i></i><b>BURCHAK</b></div>
          <div class="pin" id="pinB" style="left:700px;top:200px"><i></i><b>GAVJUM KO‘CHA</b></div>
          <i class="walker" id="wk0"></i><i class="walker" id="wk1"></i><i class="walker" id="wk2"></i><i class="walker" id="wk3"></i><i class="walker" id="wk4"></i><i class="walker" id="wk5"></i>
        </div>
      </div>
      <div id="mapq" class="clip sh" data-start="26.40" data-duration="2.10" data-track-index="53">Bu ham — marketing.</div>

      <div id="chips" class="clip" data-start="38.45" data-duration="4.75" data-track-index="54">
        <span class="chip glass" id="ch0">Reklama</span><span class="chip glass" id="ch1">O‘zingizni ko‘rsatish</span><span class="chip glass on" id="ch2">Mahsulotni ochib berish</span>
      </div>
      <div id="rings" class="clip" data-start="43.30" data-duration="8.90" data-track-index="55"><i class="ring" id="rg0"></i><i class="ring" id="rg1"></i><i class="ring" id="rg2"></i></div>

      {{BROLL}}
      {{CAPS}}
      <div id="black"></div>
      {{AUDIO}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: {{DUR}} }, 0);
      tl.set(".pin, .walker", { opacity: 0 }, 0);
      function split(t0, t1) {
        tl.fromTo("#split", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, t0);
        tl.fromTo("#divd .div-in", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, t0 + 0.05);
        tl.to("#cam", { y: -430, duration: 0.6, ease: "expo.out" }, t0);
        tl.to("#split", { yPercent: 100, duration: 0.5, ease: "power2.inOut" }, t1 - 0.5);
        tl.to("#divd .div-in", { scaleX: 0, duration: 0.45, ease: "power2.inOut" }, t1 - 0.5);
        tl.to("#cam", { y: 0, duration: 0.5, ease: "power2.inOut" }, t1 - 0.5);
      }
      {{TIMELINE}}

      // iqtibos
      tl.fromTo("#quote .lab", { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.15);
      tl.fromTo("#quote .tx", { opacity: 0, y: 30, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 0.3);
      tl.to("#quote > *", { opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "power2.inOut" }, 2.8);

      // vaqt chizig'i: yillar davomida sekin -> marketing bilan siqiladi
      tl.fromTo("#tl .tl-in", { opacity: 0, y: 80, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 3.5);
      tl.fromTo("#tln", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 3.7);
      tl.fromTo("#tlf", { scaleX: 0 }, { scaleX: 0.98, duration: 11.0, ease: "sine.inOut" }, 4.2);
      [4.9, 6.6, 9.2, 11.6, 13.4, 14.9].forEach((t, i) => tl.fromTo("#cd" + i, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, t));
      tl.to("#tla", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 15.5);
      tl.fromTo("#tlb", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15.65);
      tl.to(["#tln", "#tlf"], { scaleX: 0.36, duration: 1.4, ease: "expo.inOut" }, 16.2);
      const L0 = [8, 22, 41, 60, 79, 95];
      [0, 1, 2, 3, 4, 5].forEach(i => tl.to("#cd" + i, { x: ((3 + i * 5.5) - L0[i]) / 100 * 892, duration: 1.4, ease: "expo.inOut" }, 16.2));
      tl.to("#tl .tl-in", { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.5, ease: "power2.inOut" }, 19.6);

      // xarita: odamlar gavjum ko'chaga oqadi
      tl.fromTo("#map .map-in", { opacity: 0, y: 80, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 26.4);
      tl.fromTo("#pinA", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, 26.8);
      tl.fromTo("#pinB", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, 27.1);
      [0, 1, 2, 3, 4, 5].forEach(i => {
        const t = 27.6 + i * 0.55;
        tl.fromTo("#wk" + i, { x: -20 - i * 10, opacity: 0 }, { x: 700, opacity: 0.95, duration: 2.6, ease: "sine.inOut", immediateRender: false }, t);
        tl.to("#wk" + i, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, t + 2.4);
      });
      tl.fromTo("#pinB i", { scale: 1 }, { scale: 1.12, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 28.6);
      tl.to("#map .map-in", { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.5, ease: "power2.inOut" }, 33.15);
      tl.fromTo("#mapq", { opacity: 0, y: 20, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 26.45);
      tl.to("#mapq", { opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power2.inOut" }, 28.1);

      // chiplar
      [["#ch0", 38.5], ["#ch1", 38.75], ["#ch2", 39.0]].forEach(([id, t]) =>
        tl.fromTo(id, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, t));
      tl.to("#chips > *", { opacity: 0, y: -14, filter: "blur(8px)", duration: 0.5, ease: "power2.inOut", stagger: 0.06 }, 42.6);

      // kengayish to'lqinlari
      [0, 1, 2].forEach(i => {
        [43.4, 47.6].forEach((t0, j) => tl.fromTo("#rg" + i, { scale: 0.4, opacity: 0.0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { scale: 3.2, opacity: 0, duration: 2.6 }], ease: "sine.out", immediateRender: false }, t0 + i * 0.7 + j * 0.01));
      });

      // BILMAYDI: fon so'nadi, faqat spiker yoritilgan
      tl.fromTo("#dark", { opacity: 0 }, { opacity: 0.86, duration: 0.6, ease: "sine.inOut" }, 52.15);
      tl.to("#dark", { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 54.1);
      tl.fromTo("#black", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, 62.25);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
