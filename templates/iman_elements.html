<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Iman elementlari (uslub-31/32)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* ===== O oila (Iman) — uslub-31 (studiya monologi) + uslub-32 (split podkast) elementlari ===== */
      @font-face { font-family: "Cond"; src: url("assets/fonts/Anton.ttf"); }
      @font-face { font-family: "Sub"; src: url("assets/fonts/Inter-var.ttf"); font-weight: 100 900; }
      :root { --o1: #fa7b01; --o2: #f9a51e; --o3: #f9e23f; --red: #ab0103; --gold: #d8b04a; --ylw: #f7ef49; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* kuchli oval vinyetka (uslub-31 keng kadr) */
      .vig { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 62% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }

      /* --- gradient kondensat CAPS: har so'z = xira qatlam + gradient qatlam (chapdan o'ngga ochiladi) --- */
      .kw { position: absolute; left: 60px; right: 60px; text-align: center; font-family: "Cond"; font-size: 104px;
        line-height: 1.0; text-transform: uppercase; letter-spacing: 0.005em; }
      .kw .ln { display: block; }
      .w { position: relative; display: inline-block; margin: 0 0.07em; }
      .w .dim { color: rgba(122, 96, 34, 0.9); filter: drop-shadow(0 4px 12px rgba(0,0,0,.45)); }
      .w .grd { position: absolute; left: 0; top: 0; white-space: nowrap; color: rgba(250,123,1,.01);
        background: linear-gradient(90deg, var(--o1) 0%, var(--o2) 42%, var(--o3) 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        clip-path: inset(0 100% 0 0); }
      /* oq subtitr (sentence case) */
      .sub { position: absolute; left: 70px; right: 70px; text-align: center; font-family: "Sub"; font-weight: 600;
        font-size: 46px; line-height: 1.16; color: #fff; letter-spacing: -0.01em; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
      .sub .w { margin: 0 0.12em; }
      /* katta baland gradient raqam */
      .num { position: absolute; left: 52px; top: 250px; font-family: "Cond"; font-size: 330px; line-height: .82;
        color: rgba(250,123,1,.01); background: linear-gradient(180deg, #f9c23f 0%, #fa7b01 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        transform: scaleX(.72); transform-origin: 50% 100%; filter: drop-shadow(0 6px 16px rgba(0,0,0,.4)); }

      /* --- uslub-32 split podkast --- */
      #split { position: absolute; inset: 0; opacity: 0; } /* vaqtsiz o'rovchi — ko'rinishni tween boshqaradi */
      #top { position: absolute; left: 0; top: 0; width: 1080px; height: 1060px; overflow: hidden; }
      #top video { position: absolute; left: -189px; top: -560px; width: 1458px; height: 2592px; object-fit: cover; } /* 1.35x: bosh+yelka, yuz panel tepasidan ~1/4 da (prep.py heads bo'yicha hisobla) */
      #bot { position: absolute; left: 0; top: 1060px; width: 1080px; height: 860px; overflow: hidden; }
      #bot video { position: absolute; left: 0; top: -530px; width: 1080px; height: 1920px; object-fit: cover; }
      .seam { position: absolute; left: 60px; right: 60px; top: 965px; text-align: center; font-family: "Sub"; font-weight: 800;
        font-size: 50px; line-height: 1.1; letter-spacing: -0.02em; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
      .seam .w { color: rgba(224,173,34,.55); margin: 0 0.1em; }
      .tag { position: absolute; background: var(--red); border: 3px solid var(--gold); color: var(--ylw); font-family: "Cond";
        font-size: 36px; letter-spacing: .02em; padding: 4px 16px 6px; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <!-- 0–5 s: uslub-31 keng kadr -->
      <video id="wide" class="clip full" src="assets/src.mp4" data-start="0" data-duration="5" data-track-index="0" muted playsinline></video>
      <div class="vig clip" id="vig" data-start="0" data-duration="5" data-track-index="1"></div>
      <div class="num clip" id="n1" data-start="0" data-duration="5" data-track-index="2">1</div>
      <div class="kw clip" id="kw1" style="top:1080px" data-start="0" data-duration="5" data-track-index="3">
        <span class="ln"><span class="w"><span class="dim">Agar</span><span class="grd">Agar</span></span><span class="w"><span class="dim">shu</span><span class="grd">shu</span></span><span class="w"><span class="dim">yilning</span><span class="grd">yilning</span></span></span>
        <span class="ln"><span class="w"><span class="dim">oxirigacha</span><span class="grd">oxirigacha</span></span></span>
      </div>
      <div class="sub clip" id="s1" style="top:1300px" data-start="0" data-duration="5" data-track-index="4">
        <span class="w">qarzdorlikdan</span><span class="w">butkul</span><span class="w">xalos</span><span class="w">bo‘lib</span>
      </div>

      <!-- 5–10 s: uslub-32 split podkast -->
      <div id="split">
        <div id="top"><video id="vtop" class="clip" src="assets/src.mp4" data-start="5" data-duration="5" data-track-index="6" muted playsinline></video></div>
        <div id="bot"><video id="vbot" class="clip" src="assets/src_wide.mp4" data-start="5" data-duration="5" data-track-index="7" muted playsinline></video></div>
      </div>
      <div class="seam clip" id="seam" data-start="5" data-duration="5" data-track-index="8">
        <span class="w">NEGA</span><span class="w">AYRIM</span><span class="w">ERKAKLAR</span>
      </div>
      <div class="tag clip" id="t1" style="left:60px;top:800px" data-start="5" data-duration="5" data-track-index="9">YAXSHI KO‘RGANI YONIDA</div>
      <div class="tag clip" id="t2" style="left:470px;top:870px" data-start="5" data-duration="5" data-track-index="10">HOTIRJAMLIGI YONIDA</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 10 }, 0);

      // raqam: pastdan bo'yiga o'sadi (overshootsiz)
      tl.fromTo("#n1", { scaleY: 0.25, y: 30, opacity: 0, filter: "blur(10px)" },
        { scaleY: 1, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.25);

      // gradient so'zlar: xira kirish (0.55 s) + chapdan o'ngga "to'lish" (0.45 s)
      function kwWords(sel, times) {
        document.querySelectorAll(sel + " .w").forEach((w, i) => {
          const t = times[i];
          tl.fromTo(w, { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, t - 0.08);
          tl.fromTo(w.querySelector(".grd"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.inOut" }, t + 0.12);
        });
      }
      kwWords("#kw1", [0.6, 0.95, 1.25, 1.75]);
      // oq subtitr so'zlari
      document.querySelectorAll("#s1 .w").forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 2.5 + i * 0.32);
      });
      // chiqish (hamma narsa 0.5 s power2.inOut)
      tl.to(["#kw1", "#s1", "#n1"], { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.5, ease: "power2.inOut" }, 4.4);

      tl.set("#split", { opacity: 1 }, 5);   // hard cut (manbadagidek)
      // split: chegaradagi sariq so'zlar xira -> yorqin
      document.querySelectorAll("#seam .w").forEach((w, i) => {
        const t = 5.3 + i * 0.3;
        tl.fromTo(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);
        tl.to(w, { color: "rgba(247,239,73,1)", duration: 0.35, ease: "power2.inOut" }, t + 0.15);
      });
      // qizil yorliqlar
      [["#t1", 6.6], ["#t2", 7.4]].forEach(([s, t]) => {
        tl.fromTo(s, { scale: 0.85, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, t);
      });
      tl.to(["#seam", "#t1", "#t2"], { opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "power2.inOut" }, 9.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
